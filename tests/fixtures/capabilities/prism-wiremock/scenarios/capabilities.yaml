# Escenario de prueba de la matriz: usa escrituras, rpc, SSE, latencia,
# paginación, sorts, scopes, envelope y una relación a la vez.
name: capacidades
seed: 42
now: 2025-03-01T09:00:00Z
world:
  customers:
    total: 6
    fields:
      name: string
      email: email
  orders:
    total: 12
    ref: customers
    fields:
      reference: string
      amount: number
      paid: boolean
endpoints:
  - path: /api/orders
    entity: orders
    filters: [paid]
    pagination: { param_limit: limit, param_page: page, default_limit: 5 }
    sorts: { by: sort, order: order, fields: [amount, reference] }
    scopes: { open: paid }
    shape: envelope
    envelope: { items: data, total: total, page: page, total_pages: pages }
    latency: 120
    detail: false
writes:
  "POST /api/orders":
    expect: { status: 201, echo: true }
    mutate: { entity: orders, set: { paid: true } }
  "PATCH /api/orders/:id":
    expect: { status: 200, echo: true }
    mutate: { entity: orders, set: { paid: true } }
  "DELETE /api/orders/:id":
    expect: { status: 204 }
    mutate: { entity: orders }
rpc:
  marcar_pagado:
    expect: { status: 200 }
    body: { ok: true }
streams:
  "/api/events/orders":
    interval: 1000
    events:
      - { type: paid }
    loop: true
