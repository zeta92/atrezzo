openapi: 3.1.0
info:
  title: "atrezzo · capacidades"
  version: cbf7bcc751dc42a4
  description: "Generated by atrezzo from scenario capacidades (seed 42). Do not edit by hand. The examples are the exact projection of the world; Prism does not filter or paginate."
servers:
  - url: "http://127.0.0.1:4010"
paths:
  /api/orders:
    get:
      operationId: list_api_orders
      summary: orders (atrezzo projection)
      parameters:
        - name: paid
          in: query
          required: false
          description: "Equality; several comma-separated values; \"null\" matches nulls. Values in the world: false, true."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 5
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort
          in: query
          required: false
          description: "Sort field (amount, reference); prefix \"-\" or suffix \".desc\" for descending."
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: open
          in: query
          required: false
          description: "Scope on paid: true adds the rows with paid = true, false only rows with paid = false; absent hides rows with paid = true."
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: List of orders
          headers:
            X-Total-Count:
              description: "Total after filters, before pagination"
              schema:
                type: integer
                example: 5
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total:
                    type: integer
                  page:
                    type: integer
                required:
                  - data
                  - total
                  - page
              examples:
                scenario:
                  summary: Projection of scenario capacidades without a query
                  value:
                    data:
                      - id: 3
                        customer_id: 6
                        reference: reference 3
                        amount: 452.54
                        paid: false
                      - id: 4
                        customer_id: 3
                        reference: reference 4
                        amount: 130.98
                        paid: false
                      - id: 7
                        customer_id: 4
                        reference: reference 7
                        amount: 909.44
                        paid: false
                      - id: 10
                        customer_id: 5
                        reference: reference 10
                        amount: 40.3
                        paid: false
                      - id: 11
                        customer_id: 3
                        reference: reference 11
                        amount: 503.56
                        paid: false
                    total: 5
                    page: 1
                    pages: 1
                paid-false:
                  summary: "?paid=false"
                  value:
                    data:
                      - id: 3
                        customer_id: 6
                        reference: reference 3
                        amount: 452.54
                        paid: false
                      - id: 4
                        customer_id: 3
                        reference: reference 4
                        amount: 130.98
                        paid: false
                      - id: 7
                        customer_id: 4
                        reference: reference 7
                        amount: 909.44
                        paid: false
                      - id: 10
                        customer_id: 5
                        reference: reference 10
                        amount: 40.3
                        paid: false
                      - id: 11
                        customer_id: 3
                        reference: reference 11
                        amount: 503.56
                        paid: false
                    total: 5
                    page: 1
                    pages: 1
                paid-true:
                  summary: "?paid=true"
                  value:
                    data: []
                    total: 0
                    page: 1
                    pages: 0
        "400":
          description: Invalid pagination or sort query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
      required:
        - id
        - name
        - email
    Order:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        reference:
          type: string
        amount:
          type: number
        paid:
          type: boolean
      required:
        - id
        - customer_id
        - reference
        - amount
        - paid
