name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No install step: the plugin has no runtime or dev dependencies. The browser
      # cases skip themselves when playwright is not present in the checkout.
      - run: node --test tests/*.test.mjs tests/edge/*.test.mjs
