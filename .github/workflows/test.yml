name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the plugin has no runtime or dev dependencies. The browser
      # cases skip themselves when playwright is not present in the checkout.
      - run: node --test tests/*.test.mjs
