<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">atrezzo: API mocks built from application states</title>
  <desc id="desc">On the left, the name atrezzo and the tagline. On the right, the seeded world of the shop example: 40 orders drawn as cells, 3 of them issues. An amber beam projects GET /api/orders?limit=12 onto a screen with 12 rows; three red lines project GET /api/orders?status=issue onto 3 issue badges.</desc>

  <rect width="1200" height="480" rx="24" fill="#111215"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#a39b8b">CLAUDE CODE PLUGIN · API MOCKS</text>
    <text x="52" y="184" font-size="96" font-weight="700" letter-spacing="-2" fill="#f4efe6">atrezzo</text>
    <text x="56" y="240" font-size="28" fill="#d9d2c3">API mocks built from</text>
    <text x="56" y="276" font-size="28" fill="#d9d2c3">application states, not from</text>
    <text x="56" y="312" font-size="28" fill="#d9d2c3">isolated endpoints.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
      <line x1="56" y1="352" x2="500" y2="352" stroke="#2c2f35" stroke-width="2"/>
      <text x="56" y="388" fill="#7d776c">scenario</text><text x="176" y="388" fill="#d9d2c3">orders.yaml</text>
      <text x="56" y="420" fill="#7d776c">world</text><text x="176" y="420" fill="#d9d2c3">seed 7712 · 40 orders</text>
      <text x="56" y="452" fill="#7d776c">expect</text><text x="176" y="452" fill="#7fc79b">=12 rows · =3 badges</text>
    </g>
  </g>

  <g id="projection">
    <!-- beam: GET /api/orders?limit=12 (12 most recent orders, outlined in the world) -->
    <polygon points="818,146 818,288 940,362 940,142" fill="#f0b44c" opacity="0.13"/>
    <line x1="818" y1="146" x2="940" y2="142" stroke="#f0b44c" stroke-width="1.5" opacity="0.6"/>
    <line x1="818" y1="288" x2="940" y2="362" stroke="#f0b44c" stroke-width="1.5" opacity="0.6"/>
    <!-- GET /api/orders?status=issue: one line per issue, to the badge strip -->
    <g fill="none" stroke="#e5534b" stroke-width="2">
      <path d="M818 189 C 880 189, 890 121, 966 121"/>
      <path d="M818 245 C 900 245, 910 121, 1012 121"/>
      <path d="M818 273 C 920 273, 930 121, 1058 121"/>
    </g>
  </g>

