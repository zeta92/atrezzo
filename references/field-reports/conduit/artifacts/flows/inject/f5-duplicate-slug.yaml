# F5 injected cause: duplicate-slug. Assertions describe the intended state.
scenario: ../../scenarios/f5-duplicate-slug.yaml
base_url: http://127.0.0.1:4010
storage:
  local: { jwt: "fake-token-for-the-mock" }
steps:
  - screen: home
    visit: /
    wait_for: ".article-preview .preview-link"
    requests:
      feed: GET /api/articles/feed?limit=10&offset=0
    expect:
      - selector: ".article-preview"
        count: 10
        label: feed rows
        data: { request: feed, pick: articles }
