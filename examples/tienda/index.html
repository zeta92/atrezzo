<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop · reconciliation</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 2rem; color: #222; }
    .chips span { display: inline-block; padding: .2rem .6rem; margin-right: .4rem; border-radius: 1rem; background: #eef; }
    table { border-collapse: collapse; margin-top: 1rem; }
    td, th { padding: .3rem .8rem; border-bottom: 1px solid #ddd; text-align: left; }
    [data-status=issue] { color: #b00; font-weight: 600; }
    .issues li { color: #b00; }
  </style>
</head>
<body>
  <h1>Orders</h1>
  <section class="chips" id="customers"></section>
  <section class="issues">
    <h2>Issues</h2>
    <ul id="issues"></ul>
  </section>
  <table>
    <thead><tr><th>Reference</th><th>Customer</th><th>Status</th><th>Amount</th></tr></thead>
    <tbody id="orders"></tbody>
  </table>
  <script type="module">
    // Minimal app: renders whatever the API returns. It knows nothing about atrezzo.
    const get = (p) => fetch(p).then((r) => r.json());
    const el = (tag, attrs, text) => Object.assign(document.createElement(tag), attrs, text === undefined ? {} : { textContent: text });
    const fmt = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR' });

    const [customers, orders, issues] = await Promise.all([
      get('/api/customers'),
      get('/api/orders?limit=12'),
      get('/api/orders?status=issue'),
    ]);
    const customerName = (o) => customers.find((c) => c.id === o.customer_id)?.name;

    for (const c of customers) {
      const chip = el('span', {}, c.name);
      chip.dataset.testid = 'customer-chip';
      document.getElementById('customers').append(chip);
    }
    for (const o of issues) {
      const li = el('li', {}, `${o.reference} · ${customerName(o) ?? 'no customer'}`);
      li.dataset.testid = 'issue-badge';
      document.getElementById('issues').append(li);
    }
    const tbody = document.getElementById('orders');
    if (!orders.length) {
      const empty = el('p', {}, 'No orders yet.');
      empty.dataset.testid = 'empty-state';
      tbody.closest('table').after(empty);
    }
    for (const o of orders) {
      const tr = el('tr');
      tr.dataset.testid = 'order-row';
      const status = el('td', {}, o.status);
      status.dataset.status = o.status;
      const amount = el('td', {}, fmt.format(o.amount));
      amount.dataset.testid = 'amount';
      tr.append(el('td', {}, o.reference), el('td', {}, customerName(o) ?? '—'), status, amount);
      tbody.append(tr);
    }
    const ready = el('span');
    ready.dataset.testid = 'ready';
    document.body.append(ready);
  </script>
</body>
</html>
