# Ruta: dashboard → lista de pedidos. Las aserciones del escenario se evalúan en la
# última pantalla (lista-pedidos); aquí se añaden las propias de cada paso.
escenario: escenarios/pedidos.yaml
base_url: http://127.0.0.1:4010
steps:
  - screen: dashboard
    visit: /
    requests:
      clientes: GET /api/customers
    expect:
      - selector: "[data-testid=customer-chip]"
        count: 3
        data: { request: clientes }
  - screen: lista-pedidos
    visit: /
    wait_for: "[data-testid=listo]"
    requests:
      pedidos: GET /api/orders?limit=12
      incidencias: GET /api/orders?estado=incidencia
    expect:
      - selector: "[data-testid=order-row] [data-testid=importe]"
        min: 1
        max: 12
        label: importes visibles
        data: { request: pedidos }
