# Flow that FAILS on purpose to show the diagnosis (--diagnose):
# it counts the issues inside the first page of 12 instead of requesting them filtered.
scenario: escenarios/pedidos.yaml
steps:
  - screen: lista-pedidos
    visit: /
    requests:
      pedidos: GET /api/orders?limit=12
      incidencias: GET /api/orders?estado=incidencia
    expect:
      - selector: "[data-testid=order-row] [data-estado=incidencia]"
        count: 3
        data: { request: pedidos, where: { estado: incidencia } }
