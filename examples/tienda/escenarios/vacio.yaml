# Primer día: un cliente, ningún pedido. La pantalla debe mostrar su estado vacío.
name: vacio
seed: 1
now: 2025-03-01T09:00:00Z
world:
  clientes: 1
  pedidos: 0
endpoints:
  - path: /api/orders
    entity: pedidos
    filters: [estado, client_id]
    pagination: { param_limit: limit, param_offset: offset }
    sort: -creado_en
    include: [clientes]
  - path: /api/customers
    entity: clientes
entry: dashboard
path: [dashboard, lista-pedidos]
expect:
  - selector: "[data-testid=order-row]"
    count: 0
    data: { request: pedidos }
  - selector: "[data-testid=empty-state]"
    count: 1
